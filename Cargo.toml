[package]
name = "rein"
version = "0.1.1"
edition = "2021"
description = "rein 3D Engine"
license = "MIT"
repository = "https://github.com/NOPLAB/rein"
keywords = ["3d", "graphics", "rendering", "wgpu", "urdf", "ecs", "physics"]
categories = ["graphics", "rendering", "game-development"]

[features]
default = ["window"]
window = ["dep:winit"]
gui = ["dep:glyphon"]
compute = []
ecs = ["dep:hecs"]
physics = ["ecs"]
gpu-physics = ["physics"]
engine = ["ecs", "window"]
full = ["engine", "physics", "gpu-physics", "gui"]

[dependencies]
# GPU
wgpu = "28"
bytemuck = { version = "1.25", features = ["derive"] }

# Window (optional)
winit = { version = "0.30", optional = true }

# Text rendering (optional)
glyphon = { version = "0.10", optional = true }

# Math
glam = "0.31"

# URDF
urdf-rs = "0.9"

# ECS (optional)
hecs = { version = "0.11", optional = true }

# Utilities
tracing = "0.1"
anyhow = "1"
thiserror = "2"
pollster = "0.4"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
single_use_lifetimes = "warn"
meta_variable_misuse = "warn"
non_ascii_idents = "warn"
noop_method_call = "warn"
redundant_lifetimes = "warn"
variant_size_differences = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
deprecated_safe_2024 = "warn"
edition_2024_expr_fragment_specifier = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
keyword_idents_2018 = "warn"
keyword_idents_2024 = "warn"
let_underscore_lock = "deny"
macro_use_extern_crate = "warn"
rust_2024_incompatible_pat = "warn"

[lints.clippy]
# Lint group activation (priority = -1 so individual overrides win)
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Additional correctness/style lints
# `allow_attributes` is intentionally not enabled: some cases require `#[allow]`
# because an `#[expect]` would be flagged as unfulfilled (e.g. `pub(super)` items
# that may or may not be considered dead code depending on the call site).
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
needless_raw_strings = "warn"
panic_in_result_fn = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"

# Sensible relaxations for a graphics/ECS codebase
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
doc_markdown = "allow"
return_self_not_must_use = "allow"
# nursery lints that produce too much noise in this codebase
missing_const_for_fn = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
suboptimal_flops = "allow"
# Graphics code regularly uses precise float types; many of these are stylistic
redundant_pub_crate = "allow"
# Renderer functions are intrinsically long (pipeline setup, draw paths)
too_many_lines = "allow"
