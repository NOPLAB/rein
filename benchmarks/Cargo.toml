[package]
name = "rein-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rein = { path = "..", features = ["physics", "gpu-physics", "compute"] }
glam = "0.33.8"
hecs = "0.11.1"
anyhow = "1.0.104"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
iai-callgrind = "0.16.1"

[[bench]]
name = "physics"
harness = false

[[bench]]
name = "physics_iai"
harness = false
